name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    # The shared contract tests use numpy only, so this stays fast and needs
    # no torch install. If this goes red, the two halves of the code have drifted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
